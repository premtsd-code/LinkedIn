networks:
  linkedin-network:

volumes:
  kafka_data:
  linkedin-db-data:
  connections-db-data:
  opensearch-data:

# ============================================================
# PORT MAP — LinkedIn Project (10000–10999 range)
# ============================================================
# Microservices:    10000–10099
#   10000 → api-gateway
#   10001 → discovery-server
#   10003 → notification-service
# Databases:        10100–10199
#   10100 → postgres (linkedin-db)
#   10101 → neo4j browser
#   10102 → neo4j bolt
#   10103 → redis
# Messaging:        10200–10299
#   10201 → kafbat-ui
# Observability:    10300–10399
#   10300 → zipkin
#   10301 → opensearch
#   10302 → opensearch-dashboards
#   10303 → opensearch-logstash
# Infrastructure:   10400–10499
#   10400 → traefik http
#   10401 → traefik https
#   10402 → traefik dashboard
# App:              10500–10599
#   10500 → prem-portfolio
# ============================================================

services:

  # ── Infrastructure ───────────────────────────────────────

  traefik:
    image: traefik:v3.0
    platform: linux/amd64
    container_name: linkedin-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=i.prem.tsd@outlook.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--log.level=INFO"
    ports:
      - "10400:80"
      - "10401:443"
      - "10402:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt
      - ./traefik/certs:/certs
      - ./traefik/config:/etc/traefik/dynamic
    networks:
      - linkedin-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.premtsd.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=traefik"

  # ── Config + Discovery ───────────────────────────────────

  config-server:
    build:
      context: ./config-server
    platform: linux/amd64
    container_name: linkedin-config-server
    networks:
      - linkedin-network
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./logs/config-server:/logs/config-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=config-server"

  discovery-server:
    build:
      context: ./discovery-server
    platform: linux/amd64
    restart: unless-stopped
    container_name: linkedin-discovery-server
    networks:
      - linkedin-network
    ports:
      - "10001:8761"
    depends_on:
      config-server:
        condition: service_healthy
    volumes:
      - ./logs/discovery-server:/logs/discovery-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eureka.rule=Host(`eureka.premtsd.com`)"
      - "traefik.http.routers.eureka.entrypoints=websecure"
      - "traefik.http.routers.eureka.tls.certresolver=letsencrypt"
      - "traefik.http.services.eureka.loadbalancer.server.port=8761"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=discovery-server"

  # ── Databases ────────────────────────────────────────────

  linkedin-db:
    image: postgres:15
    platform: linux/amd64
    container_name: linkedin-db
    environment:
      - POSTGRES_DB=linkedinDB
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "10100:5432"
    networks:
      - linkedin-network
    volumes:
      - linkedin-db-data:/var/lib/postgresql/data
      - ./logs/linkedin-db:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=linkedin-db"

  connections-db:
    image: neo4j:5
    platform: linux/amd64
    container_name: connections-db
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "10101:7474"
      - "10102:7687"
    volumes:
      - connections-db-data:/data
      - ./logs/connections-db:/logs
    networks:
      - linkedin-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=connections-db"

  redis:
    image: bitnami/redis:latest
    platform: linux/amd64
    container_name: linkedin-redis
    environment:
      - REDIS_PASSWORD=secret123
    ports:
      - "10103:6379"
    networks:
      - linkedin-network
    volumes:
      - ./logs/redis:/opt/bitnami/redis/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis"

  # ── Messaging ────────────────────────────────────────────

  kafka:
    image: apache/kafka:3.7.0
    platform: linux/amd64
    container_name: linkedin-kafka
    volumes:
      - "kafka_data:/tmp/kraft-combined-logs"
      - ./logs/kafka:/opt/kafka/logs
    networks:
      - linkedin-network
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafka"

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    platform: linux/amd64
    container_name: linkedin-kafbat-ui
    ports:
      - "10201:8080"
    depends_on:
      - kafka
    networks:
      - linkedin-network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    volumes:
      - ./logs/kafbat-ui:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka-ui.rule=Host(`kafka.premtsd.com`)"
      - "traefik.http.routers.kafka-ui.entrypoints=websecure"
      - "traefik.http.routers.kafka-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafbat-ui"

  # ── Microservices ─────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
    platform: linux/amd64
    container_name: linkedin-api-gateway
    ports:
      - "10000:8080"
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - config-server
    volumes:
      - ./logs/api-gateway:/logs/api-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.premtsd.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolalloworiginlist=https://premtsd.com,https://www.premtsd.com"
      - "traefik.http.middlewares.api-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.api-cors.headers.addvaryheader=true"
      - "traefik.http.routers.api.middlewares=api-cors"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api-gateway"

  user-service:
    build:
      context: ./user-service
    platform: linux/amd64
    container_name: linkedin-user-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - linkedin-db
      - kafka
      - config-server
    volumes:
      - ./app/logs/user-service:/app/logs/user-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=user-service"

  post-service:
    build:
      context: ./post-service
    platform: linux/amd64
    container_name: linkedin-post-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - linkedin-db
      - kafka
      - config-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: secret123
    volumes:
      - ./app/logs/post-service:/app/logs/post-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=post-service"

  connections-service:
    build:
      context: ./connections-service
    platform: linux/amd64
    container_name: linkedin-connections-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - connections-db
      - kafka
      - config-server
    volumes:
      - ./logs/connections-service:/logs/connections-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=connections-service"

  notification-service:
    build:
      context: ./notification-service
    platform: linux/amd64
    container_name: linkedin-notification-service
    ports:
      - "10003:9293"
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - linkedin-db
      - kafka
      - config-server
    volumes:
      - ./logs/notification-service:/logs/notification-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=notification-service"

  uploader-service:
    build:
      context: ./uploader-service
    platform: linux/amd64
    container_name: linkedin-uploader-service
    networks:
      - linkedin-network
    depends_on:
      - discovery-server
      - config-server
    volumes:
      - ./app/logs/uploader-service:/app/logs/uploader-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=uploader-service"

  zipkin:
    image: openzipkin/zipkin
    platform: linux/amd64
    container_name: linkedin-zipkin
    ports:
      - "10300:9411"
    networks:
      - linkedin-network
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - ./logs/zipkin:/zipkin/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zipkin.rule=Host(`zipkin.premtsd.com`)"
      - "traefik.http.routers.zipkin.entrypoints=websecure"
      - "traefik.http.routers.zipkin.tls.certresolver=letsencrypt"
      - "traefik.http.services.zipkin.loadbalancer.server.port=9411"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=zipkin"

  opensearch-init:
    image: busybox:latest
    platform: linux/amd64
    container_name: linkedin-opensearch-init
    user: root
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./logs/opensearch:/usr/share/opensearch/logs
    command: >
      sh -c "
        mkdir -p /usr/share/opensearch/logs &&
        mkdir -p /usr/share/opensearch/data &&
        chown -R 1000:1000 /usr/share/opensearch/logs &&
        chown -R 1000:1000 /usr/share/opensearch/data &&
        chmod -R 755 /usr/share/opensearch/logs &&
        chmod -R 755 /usr/share/opensearch/data
      "

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    platform: linux/amd64
    container_name: linkedin-opensearch
    user: "1000:1000"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "10301:9200"
    networks:
      - linkedin-network
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./logs/opensearch:/usr/share/opensearch/logs
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=opensearch"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    platform: linux/amd64
    container_name: linkedin-opensearch-dashboards
    user: "1000:1000"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "10302:5601"
    depends_on:
      - opensearch
    networks:
      - linkedin-network
    volumes:
      - ./logs/opensearch-dashboards:/usr/share/opensearch-dashboards/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opensearch-http.rule=Host(`logs.premtsd.com`)"
      - "traefik.http.routers.opensearch-http.entrypoints=web"
      - "traefik.http.services.opensearch-http.loadbalancer.server.port=5601"
      - "traefik.http.routers.opensearch.rule=Host(`logs.premtsd.com`)"
      - "traefik.http.routers.opensearch.entrypoints=websecure"
      - "traefik.http.routers.opensearch.tls.certresolver=letsencrypt"
      - "traefik.http.services.opensearch.loadbalancer.server.port=5601"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=opensearch-dashboards"

  opensearch-logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    platform: linux/amd64
    container_name: linkedin-opensearch-logstash
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logs/opensearch-logstash:/usr/share/logstash/logs
    ports:
      - "10303:5044"
    networks:
      - linkedin-network
    depends_on:
      - opensearch
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=opensearch-logstash"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    platform: linux/amd64
    container_name: linkedin-filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./app/logs:/app/logs:ro
      - ./logs:/logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs/filebeat:/var/log/filebeat
    networks:
      - linkedin-network
    depends_on:
      - opensearch-logstash
    command: ["--strict.perms=false"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=filebeat"