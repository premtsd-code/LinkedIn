# Test configuration to disable external dependencies
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.config.discovery.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
eureka.client.enabled=false

# Use H2 in-memory database for unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Kafka for unit tests
spring.kafka.bootstrap-servers=localhost:9092

# JWT configuration for tests
jwt.secretKey=testSecretKeyThatIsLongEnoughForHS256Algorithm

# Logging
logging.level.com.premtsd.linkedin.userservice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
