global
    maxconn 300
    log stdout format raw local0

defaults
    mode tcp
    log global
    retries 2
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 5s

# Stats dashboard: http://localhost:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s

# ===========================================================================
# Two independent Patroni clusters behind one HAProxy:
#   user-pg       (userDB)                    -> 5432 write / 5433 read
#   engagement-pg (postDB + notificationDB)   -> 5434 write / 5435 read
# Health checks hit the Patroni REST API (:8008): GET /primary returns 200
# only on that cluster's leader, GET /replica only on streaming replicas.
# ===========================================================================

listen user_write
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-user1 patroni-user1:5432 maxconn 100 check port 8008
    server patroni-user2 patroni-user2:5432 maxconn 100 check port 8008

listen user_read
    bind *:5433
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-user1 patroni-user1:5432 maxconn 100 check port 8008
    server patroni-user2 patroni-user2:5432 maxconn 100 check port 8008

listen engagement_write
    bind *:5434
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-eng1 patroni-eng1:5432 maxconn 100 check port 8008
    server patroni-eng2 patroni-eng2:5432 maxconn 100 check port 8008

listen engagement_read
    bind *:5435
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni-eng1 patroni-eng1:5432 maxconn 100 check port 8008
    server patroni-eng2 patroni-eng2:5432 maxconn 100 check port 8008
