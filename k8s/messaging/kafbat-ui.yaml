apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafbat-ui
  namespace: linkedin-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafbat-ui
  template:
    metadata:
      labels:
        app: kafbat-ui
    spec:
      containers:
      - name: kafbat-ui
        image: ghcr.io/kafbat/kafka-ui:latest
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: linkedin-prod
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: kafka:9092
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafbat-ui
  namespace: linkedin-prod
spec:
  type: NodePort
  selector:
    app: kafbat-ui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 32201
