apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: linkedin-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
      - name: discovery-server
        image: premtsd18/discovery-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8761
        envFrom:
        - configMapRef:
            name: linkedin-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8761
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8761
          initialDelaySeconds: 40
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: linkedin-prod
spec:
  type: NodePort
  selector:
    app: discovery-server
  ports:
  - port: 8761
    targetPort: 8761
    nodePort: 32001
