# Test configuration to disable external dependencies
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.config.discovery.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
eureka.client.enabled=false

# Disable Neo4j for unit tests (will be overridden by Testcontainers when needed)
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

# Disable Kafka for unit tests
spring.kafka.bootstrap-servers=localhost:9092

# Logging
logging.level.com.premtsd.linkedin.connectionservice=DEBUG
logging.level.org.springframework.web=DEBUG
