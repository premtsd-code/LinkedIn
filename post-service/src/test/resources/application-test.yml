# Test configuration to disable external dependencies
spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
      discovery:
        enabled: false
      fail-fast: false

  # H2 Database for testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Redis configuration for testing
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      database: 1

  # Kafka configuration for testing
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: test-group
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

eureka:
  client:
    enabled: false

# Disable circuit breaker for tests
resilience4j:
  circuitbreaker:
    instances:
      uploadImageCircuitBreaker:
        enabled: false
  ratelimiter:
    instances:
      uploadImageRateLimiter:
        enabled: false

# Logging
logging:
  level:
    com.premtsd.linkedin.postservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.test: DEBUG
    org.springframework.kafka: DEBUG

# Use plain H2 datasource instead of the HA routing datasource in tests
app:
  datasource:
    routing:
      enabled: false
