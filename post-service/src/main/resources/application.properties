spring.application.name=posts-service
spring.config.import=configserver:http://config-server:8888

# --- HA Postgres read/write routing (HAProxy -> Patroni cluster) ---
# Writes go to the current primary via haproxy:5432, read-only transactions
# to the replicas via haproxy:5433. Overridable per environment via env vars.
app.datasource.routing.enabled=true
app.datasource.writer.jdbc-url=${DB_WRITER_URL:jdbc:postgresql://haproxy:5434/postDB}
app.datasource.writer.username=${DB_USER:post_svc}
app.datasource.writer.password=${DB_PASSWORD:password}
app.datasource.writer.maximum-pool-size=10
app.datasource.reader.jdbc-url=${DB_READER_URL:jdbc:postgresql://haproxy:5435/postDB}
app.datasource.reader.username=${DB_USER:post_svc}
app.datasource.reader.password=${DB_PASSWORD:password}
app.datasource.reader.maximum-pool-size=10

# OSIV binds one EntityManager (and its routed connection) to the whole HTTP
# request, which breaks per-transaction read/write routing (a read-only tx
# materializes a REPLICA connection that a later write in the same request
# would reuse). Also a general best practice to disable.
spring.jpa.open-in-view=false
