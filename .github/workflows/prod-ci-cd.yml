name: Production CI/CD

on:
  push:
    branches: [main]

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      user-service: ${{ steps.changes.outputs.user-service }}
      post-service: ${{ steps.changes.outputs.post-service }}
      connections-service: ${{ steps.changes.outputs.connections-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      uploader-service: ${{ steps.changes.outputs.uploader-service }}
      config-server: ${{ steps.changes.outputs.config-server }}
      discovery-server: ${{ steps.changes.outputs.discovery-server }}
      k8s: ${{ steps.changes.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            user-service:
              - 'user-service/**'
            post-service:
              - 'post-service/**'
            connections-service:
              - 'connections-service/**'
            notification-service:
              - 'notification-service/**'
            uploader-service:
              - 'uploader-service/**'
            config-server:
              - 'config-server/**'
            discovery-server:
              - 'discovery-server/**'
            k8s:
              - 'k8s/**'

  build-and-push:
    name: Build and Push Production Images
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        service:
          - { name: api-gateway, changed: "${{ needs.detect-changes.outputs.api-gateway }}" }
          - { name: user-service, changed: "${{ needs.detect-changes.outputs.user-service }}" }
          - { name: post-service, changed: "${{ needs.detect-changes.outputs.post-service }}" }
          - { name: connections-service, changed: "${{ needs.detect-changes.outputs.connections-service }}" }
          - { name: notification-service, changed: "${{ needs.detect-changes.outputs.notification-service }}" }
          - { name: uploader-service, changed: "${{ needs.detect-changes.outputs.uploader-service }}" }
          - { name: config-server, changed: "${{ needs.detect-changes.outputs.config-server }}" }
          - { name: discovery-server, changed: "${{ needs.detect-changes.outputs.discovery-server }}" }
    steps:
      - uses: actions/checkout@v4
        if: matrix.service.changed == 'true'
      - name: Set up JDK 17
        if: matrix.service.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven
      - name: Build service
        if: matrix.service.changed == 'true'
        run: cd ${{ matrix.service.name }} && mvn package -DskipTests
      - name: Login to DockerHub
        if: matrix.service.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Trivy security scan
        if: matrix.service.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.service.name }}
          severity: CRITICAL,HIGH
          exit-code: 0
      - name: Build and push image
        if: matrix.service.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.name }}
          platforms: linux/amd64
          push: true
          tags: |
            premtsd18/${{ matrix.service.name }}:latest
            premtsd18/${{ matrix.service.name }}:${{ github.sha }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Update configmap
        run: kubectl apply -f k8s/configmap.yaml
      - name: Deploy changed services
        run: |
          for service in api-gateway user-service post-service connections-service notification-service uploader-service config-server discovery-server; do
            kubectl set image deployment/$service \
              $service=premtsd18/$service:${{ github.sha }} \
              -n linkedin-prod \
              --ignore-not-found=true
          done
      - name: Wait for rollouts
        run: |
          for service in api-gateway user-service post-service connections-service notification-service uploader-service; do
            kubectl rollout status deployment/$service \
              -n linkedin-prod --timeout=5m 2>/dev/null || true
          done
      - name: Smoke test
        run: |
          sleep 30
          curl -f http://${{ secrets.HETZNER_IP }}:32000/actuator/health
          echo "PROD deployment successful ✅"
      - name: Rollback on failure
        if: failure()
        run: |
          for service in api-gateway user-service post-service connections-service notification-service uploader-service; do
            kubectl rollout undo deployment/$service -n linkedin-prod 2>/dev/null || true
          done
          echo "Rolled back PROD ✅"
