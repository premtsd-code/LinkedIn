spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    config:
      enabled: false
  data:
    redis:
      host: localhost
eureka:
  client:
    enabled: false
logging:
  level:
    com.premtsd: DEBUG
