spring.application.name=notification-service
spring.config.import=configserver:http://config-server:8888
server.servlet.context-path=/notifications
# --- HA Postgres read/write routing (HAProxy -> Patroni cluster) ---
# Writes go to the current primary via haproxy:5432, read-only transactions
# to the replicas via haproxy:5433. Overridable per environment via env vars.
app.datasource.routing.enabled=true
app.datasource.writer.jdbc-url=${DB_WRITER_URL:jdbc:postgresql://haproxy:5434/notificationDB}
app.datasource.writer.username=${DB_USER:notification_svc}
app.datasource.writer.password=${DB_PASSWORD:password}
app.datasource.writer.maximum-pool-size=10
app.datasource.reader.jdbc-url=${DB_READER_URL:jdbc:postgresql://haproxy:5435/notificationDB}
app.datasource.reader.username=${DB_USER:notification_svc}
app.datasource.reader.password=${DB_PASSWORD:password}
app.datasource.reader.maximum-pool-size=10

# --- Kafka consumer resilience ---
# ErrorHandlingDeserializer: malformed records become handleable errors
# (-> retries -> <topic>.DLT) instead of crash-looping the container.
# NOTE: if the config repo defines spring.kafka.consumer.* these same keys
# there win; mirror this setup there for production.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages=com.premtsd.linkedin.*

# OSIV binds one EntityManager (and its routed connection) to the whole HTTP
# request, which breaks per-transaction read/write routing (a read-only tx
# materializes a REPLICA connection that a later write in the same request
# would reuse). Also a general best practice to disable.
spring.jpa.open-in-view=false
